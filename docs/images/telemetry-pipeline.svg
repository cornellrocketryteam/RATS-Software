<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc">
  <title id="title">RATS telemetry pipeline</title>
  <desc id="desc">An antenna symbol and highlighted wireless radio link connect rocket telemetry to the RFD900x ground receiver. UART connects the receiver to a Raspberry Pi Pico. The Pico logs to an SD card and sends records over USB to a Docker host proxy. The proxy writes InfluxDB, which supplies the team's ground dashboard. Blue identifies hardware, teal software, and amber storage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526477"/></marker>
    <marker id="radio-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1f4d94"/></marker>
  </defs>
  <rect width="1080" height="470" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <!-- A compact antenna symbol distinguishes the wireless hop. -->
    <rect x="235" y="46" width="230" height="124" rx="14" fill="#edf4ff" stroke="#9db8e8" stroke-width="1.3"/>
    <path d="M192 108H510" stroke="#1f4d94" stroke-width="2.6" stroke-dasharray="6 7" fill="none" marker-end="url(#radio-arrow)"/>
    <circle cx="350" cy="95" r="42" fill="#edf4ff"/>
    <g transform="translate(350 90) scale(0.65) translate(-350 -100)">
      <g stroke="#1f4d94" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M330 75Q311 91 330 107M316 61Q282 91 316 121"/>
        <path d="M370 75Q389 91 370 107M384 61Q418 91 384 121"/>
        <path d="M350 94V127M350 101L332 133H368ZM342 117H358"/>
      </g>
      <circle cx="350" cy="86" r="7" fill="#1f4d94"/>
    </g>
    <text x="350" y="148" font-size="18" font-weight="700" fill="#1f4d94">Wireless radio link</text>

    <g stroke="#526477" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
      <path d="M730 108H830"/>
      <path d="M944 156V224H493V270"/>
      <path d="M944 156V270"/>
      <path d="M386 314H297"/>
      <path d="M192 358V396H498"/>
    </g>
    <g fill="#526477" font-size="17">
      <text x="780" y="88">UART</text><text x="710" y="214">USB</text><text x="339" y="298">Network</text><text x="348" y="384">Ground software</text>
    </g>
    <g stroke-width="1.8">
      <rect x="22" y="60" width="170" height="96" rx="10" fill="#e8effb" stroke="#1f4d94"/>
      <rect x="510" y="60" width="220" height="96" rx="10" fill="#e8effb" stroke="#1f4d94"/>
      <rect x="830" y="60" width="228" height="96" rx="10" fill="#e8effb" stroke="#1f4d94"/>
      <rect x="386" y="270" width="214" height="88" rx="10" fill="#e4f3f1" stroke="#00666b"/>
      <rect x="834" y="270" width="220" height="88" rx="10" fill="#fff1d8" stroke="#a65f00"/>
      <rect x="88" y="270" width="209" height="88" rx="10" fill="#fff1d8" stroke="#a65f00"/>
      <rect x="498" y="366" width="210" height="60" rx="10" fill="#e4f3f1" stroke="#00666b"/>
    </g>
    <g fill="#14283f" font-size="21" font-weight="700">
      <text x="107" y="102">Rocket</text><text x="620" y="102">RFD900x</text><text x="944" y="102">RATS Pico</text><text x="493" y="309">Host proxy</text><text x="944" y="309">SD card</text><text x="192" y="309">InfluxDB</text><text x="603" y="403">Team dashboard</text>
    </g>
    <g fill="#42566b" font-size="17">
      <text x="107" y="129">Flight telemetry</text><text x="620" y="129">Radio receiver</text><text x="944" y="129">Decode and forward</text><text x="493" y="335">C++ in Docker</text><text x="944" y="335">Local log</text><text x="192" y="335">Telemetry history</text>
    </g>
    <g text-anchor="start" font-size="15">
      <circle cx="42" cy="448" r="6" fill="#1f4d94"/><text x="55" y="453" fill="#42566b">Hardware</text><circle cx="163" cy="448" r="6" fill="#00666b"/><text x="176" y="453" fill="#42566b">Software</text><circle cx="280" cy="448" r="6" fill="#a65f00"/><text x="293" y="453" fill="#42566b">Storage</text>
    </g>
  </g>
</svg>
